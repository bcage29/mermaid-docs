name: Release

on:
  push:
    tags: ['v*']
  # Dispatching on a branch runs verification only; dispatching on a v* tag
  # goes through the same approval gate as a tag push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($pkg)" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Pack release tarball
        run: |
          mkdir -p package
          npm pack --pack-destination package

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate 1: the npm-publish environment requires manual approval before this
    # job starts. Its name is also pinned in the npm trusted publisher config.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/mermaid-docs
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for a publish token
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Disables automatic npm caching to reduce cache-poisoning risk in a
          # job that holds publish credentials.
          package-manager-cache: false

      # Pin a CLI new enough for staged publishing without taking npm 12 changes.
      - run: npm install -g npm@11.19.1

      - uses: actions/download-artifact@v6
        with:
          name: npm-package
          path: package

      # Gate 2: uploads to npm's staging area. Provenance is generated
      # automatically under trusted publishing. Goes live only after a
      # maintainer approves it with 2FA.
      - name: Stage release on npm
        run: npm stage publish ./package/*.tgz

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Draft until the staged version is approved on npm, so the release
      # never advertises a version that isn't on the registry yet.
      - name: Create draft GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft
        env:
          GH_TOKEN: ${{ github.token }}
